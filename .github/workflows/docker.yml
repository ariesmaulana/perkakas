name: Docker Build & Push

on:
  push:
    tags:
      - 'release-V*'
      - 'staging-V*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: tags
        run: |
          REF="${GITHUB_REF}"
          REPO="ghcr.io/${{ github.repository }}"

          if [[ "$REF" == refs/tags/release-V* ]]; then
            VERSION="${REF#refs/tags/release-}"
            TAGS="${REPO}:${VERSION},${REPO}:latest,${REPO}:staging"
            echo "env=release" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/tags/staging-V* ]]; then
            VERSION="${REF#refs/tags/staging-}"
            TAGS="${REPO}:staging-${VERSION},${REPO}:staging"
            echo "env=staging" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Generated tags: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
